# Inventory for the disposable lab "server" (lab/docker-compose.yml).
# Lab-only throw-away password: the container is reachable only on the
# lab's private Docker network. For a real server use ../inventory.ini with
# SSH keys or --ask-pass / --ask-become-pass.
[web]
hotel-server ansible_host=target ansible_user=ubuntu ansible_password=labpass ansible_become_password=labpass

# Inventory = the list of servers Ansible manages, grouped by role.
# Replace ansible_host / ansible_user with your server's details.
# Target OS: Ubuntu 22.04 or 24.04 (needs SSH access and a sudo-capable user).

[web]
hotel-server ansible_host=192.168.56.10 ansible_user=ubuntu

# More servers would simply be more lines in the group, e.g.:
# hotel-server-2 ansible_host=192.168.56.11 ansible_user=ubuntu

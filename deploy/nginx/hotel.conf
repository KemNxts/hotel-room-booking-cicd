# Nginx = the public entry point. It forwards dynamic requests to Gunicorn
# and serves static files itself (faster, and frees the Python workers).

upstream hotel_app {
    # "app" is the service name in docker-compose.yml; Docker's internal DNS
    # resolves it to the app container.
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Our forms are tiny; reject anything large.
    client_max_body_size 1m;

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1h;
    }

    location / {
        proxy_pass http://hotel_app;
        # Pass the original host/client details on to the app.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Local Jenkins + local Docker image registry for this project.
#
#   cd deploy/jenkins
#   cp .env.example .env        # then set the two passwords in .env
#   docker compose up -d --build
#   -> Jenkins:  http://localhost:8090  (user: admin)
#   -> Registry: localhost:5000  (list images: http://localhost:5000/v2/_catalog)
name: hotel-jenkins

services:
  jenkins:
    build:
      context: .
      # The repo's certs/ folder (optional extra root CAs, see certs/README.md).
      additional_contexts:
        certs: ../../certs
    image: hotel-jenkins:local
    ports:
      - "127.0.0.1:8090:8080"   # Jenkins UI, reachable only from this computer
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in deploy/jenkins/.env}
      HOTEL_SECRET_KEY: ${HOTEL_SECRET_KEY:?set HOTEL_SECRET_KEY in deploy/jenkins/.env}
      HOTEL_REPO_URL: ${HOTEL_REPO_URL:-file:///repo}
      HOTEL_REPO_BRANCH: ${HOTEL_REPO_BRANCH:-develop}
    # Group that owns docker.sock, so the jenkins user may use it
    # (0 on Docker Desktop; on Linux use: stat -c %g /var/run/docker.sock).
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins-home:/var/jenkins_home                # jobs, builds, plugins - survives restarts
      - /var/run/docker.sock:/var/run/docker.sock     # use the host's Docker to build/deploy
      - ../..:/repo:ro                                # this git repository, read-only
    restart: unless-stopped

  # Private image registry (the official "registry" image). The pipeline
  # pushes every tested release here and deploys from it. Images are kept
  # in a volume, so older releases stay available for rollback.
  # Docker treats localhost registries as trusted, so no TLS setup is needed.
  registry:
    image: registry:2
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

volumes:
  jenkins-home:
  registry-data:

{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create an account</h1>
  <form method="post" id="register-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" value="{{ form.get('full_name', '') }}" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>

    <label for="password">Password <small>(at least 8 characters)</small></label>
    <input id="password" name="password" type="password" minlength="8" required>

    <button type="submit" id="register-btn">Register</button>
  </form>
  <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
